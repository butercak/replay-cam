<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>回放相機</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="回放相機">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #000;
    --panel: #17171a;
    --panel-2: #222227;
    --line: #34343b;
    --text: #f2f2f4;
    --muted: #9a9aa3;
    --accent: #ff3b45;
    --accent-2: #ff6b73;
    --ok: #34d17a;
    --warn: #ffb020;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  #preview { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #preview.mirror { transform: scaleX(-1); }

  .topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 8px;
    padding: calc(var(--safe-t) + 10px) calc(var(--safe-r) + 12px) 10px calc(var(--safe-l) + 12px);
    background: linear-gradient(#000a, #0000); z-index: 5; }
  .status { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .tools { flex: none; display: flex; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; max-width: 100%;
    background: #000a; border: 1px solid #ffffff22; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.sub { padding: 4px 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--accent); animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .spacer { flex: 1; }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid #ffffff22; background: #000a;
    display: grid; place-items: center; padding: 0; position: relative; flex: none; }
  .icon-btn svg { width: 22px; height: 22px; }
  .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }
  .sub { color: var(--muted); font-size: 12px; }

  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 16px 16px calc(var(--safe-b) + 18px); background: linear-gradient(#0000, #000b); }
  .controls { display: flex; align-items: center; gap: 30px; }
  #saveBtn, #goBtn { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; background: var(--accent);
    box-shadow: 0 0 0 4px #0006; display: grid; place-items: center; transition: transform .1s; }
  #goBtn { background: #0000; }
  #goBtn span { width: 58px; height: 58px; border-radius: 50%; background: var(--accent); }
  #saveBtn:active, #goBtn:active, .side-btn:active { transform: scale(.93); }
  #saveBtn:disabled { opacity: .45; }
  #saveBtn svg { width: 34px; height: 34px; }
  .side-btn { width: 52px; height: 52px; border-radius: 50%; border: 1px solid #ffffff33; background: #000a;
    display: grid; place-items: center; padding: 0; transition: transform .1s; }
  .side-btn svg { width: 22px; height: 22px; }
  #saveLabel { font-size: 14px; text-shadow: 0 1px 3px #000; text-align: center; }
  body:not(.running) .controls, body:not(.running) #memText { display: none; }
  body.running #goBtn, body.running #idle { display: none; }

  #idle { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 120px 28px 170px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; pointer-events: none; }
  #idle b { color: var(--text); font-size: 20px; }

  #dim { position: fixed; inset: 0; z-index: 6; background: #000; opacity: .97; display: none;
    align-items: flex-start; justify-content: center; padding-top: calc(var(--safe-t) + 24px); color: #555; font-size: 13px; }
  body.dimmed #dim { display: flex; }
  body.dimmed .bottombar { z-index: 7; background: none; opacity: .5; }

  @media (orientation: landscape) and (max-height: 560px) {
    .bottombar { left: auto; top: 0; width: auto; justify-content: center; background: linear-gradient(90deg, #0000, #000b);
      padding: 16px calc(var(--safe-r) + 18px) 16px 24px; }
    .controls { flex-direction: column; gap: 18px; }
  }

  .overlay { position: fixed; inset: 0; z-index: 20; background: #000e; display: flex; align-items: center; justify-content: center;
    padding: calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px); }
  .card { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .card h1 { margin: 0 0 6px; font-size: 22px; }
  .card p { margin: 8px 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .primary { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); font-weight: 700; font-size: 17px; }
  .secondary { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-size: 14px; }
  .err { color: var(--accent-2) !important; }

  .sheet-wrap { position: fixed; inset: 0; z-index: 15; background: #0008; display: none; align-items: flex-end; justify-content: center; }
  .sheet-wrap.open { display: flex; }
  .sheet { width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto; background: var(--panel); border-radius: 18px 18px 0 0;
    border: 1px solid var(--line); border-bottom: 0; padding: 18px 18px calc(var(--safe-b) + 18px); -webkit-user-select: text; user-select: text; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; display: flex; align-items: center; }
  .sheet h2 .close { margin-left: auto; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .row label { flex: 1; font-size: 15px; }
  .row label small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row select, .row input[type=number] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 110px; font-size: 15px; }
  .row input[type=number] { width: 110px; }
  .row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  .estimate { margin: 10px 0 4px; padding: 10px 12px; background: var(--panel-2); border-radius: 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .estimate.warn { color: var(--warn); }

  .clip { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .clip video { width: 112px; height: 63px; background: #000; border-radius: 8px; object-fit: cover; flex: none; }
  .clip .info { flex: 1; min-width: 0; font-size: 13px; }
  .clip .info b { display: block; font-size: 14px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .clip .acts button { padding: 7px 10px; font-size: 13px; }
  .clip .acts .share { background: var(--accent); border-color: var(--accent); }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }

  #toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 70px); transform: translateX(-50%); z-index: 30;
    background: #000d; border: 1px solid #ffffff2a; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; transition: opacity .25s; }
</style>
</head>
<body>
<video id="preview" playsinline muted autoplay></video>
<div id="flash"></div>

<div class="topbar">
  <div class="status">
    <span class="pill"><span class="dot" id="liveDot"></span><span id="bufText">待機中</span></span>
    <span class="pill sub" id="memText" hidden></span>
  </div>
  <div class="tools">
  <button class="icon-btn" id="flipBtn" aria-label="切換鏡頭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14.5 9.5v1.7h-1.7M9.5 16.5v-1.7h1.7"/></svg>
  </button>
  <button class="icon-btn" id="clipsBtn" aria-label="已保存的影片">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>
    <span class="badge" id="clipCount" hidden>0</span>
  </button>
  <button class="icon-btn" id="settingsBtn" aria-label="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  </div>
</div>

<div id="idle">
  <b>回放相機</b>
  <div id="idleMsg">按下面的紅色按鈕開始。開始後才會開相機，並一直保留最近 X 分鐘的畫面。<br>打完一首按「保存」，不用了就按「停止」省電。</div>
</div>

<div id="dim">省電黑屏中 ・ 點一下恢復畫面（仍在緩衝）</div>

<div class="bottombar">
  <button id="goBtn" aria-label="開始"><span></span></button>
  <div class="controls">
    <button class="side-btn" id="stopBtn" aria-label="停止">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="#fff"/></svg>
    </button>
    <button id="saveBtn" aria-label="保存回放" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
    </button>
    <button class="side-btn" id="dimBtn" aria-label="省電黑屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <div id="saveLabel">按下開始</div>
</div>

<!-- error overlay -->
<div class="overlay" id="startOverlay" style="display:none">
  <div class="card">
    <h1>回放相機</h1>
    <p>相機開著的時候會在背景一直錄，但只保留<b>最近 X 分鐘</b>。打完一首歌按「保存」，就會把剛剛那段存成 MP4。</p>
    <p>錄影期間請讓這個畫面保持在前景，手機不要鎖定或切到別的 App，否則相機會被系統關掉。</p>
    <p id="startMsg" class="err" hidden></p>
    <button class="primary" id="startBtn">重新開始</button>
  </div>
</div>

<!-- settings -->
<div class="sheet-wrap" id="settingsSheet">
  <div class="sheet">
    <h2>設定 <button class="secondary close" data-close>完成</button></h2>
    <div class="row"><label for="sMinutes">回放長度（分鐘）<small>按保存時存下多久的畫面</small></label>
      <input type="number" id="sMinutes" min="0.25" max="30" step="0.25" inputmode="decimal"></div>
    <div class="row"><label for="sRes">解析度</label>
      <select id="sRes"><option value="720">720p</option><option value="1080">1080p</option><option value="2160">4K（很吃記憶體）</option></select></div>
    <div class="row"><label for="sFps">幀率</label>
      <select id="sFps"><option value="30">30 fps</option><option value="60">60 fps</option></select></div>
    <div class="row"><label for="sMbps">畫質（位元率）<small>手元動作快，建議 8 以上</small></label>
      <select id="sMbps"><option value="4">4 Mbps</option><option value="6">6 Mbps</option><option value="8">8 Mbps</option><option value="12">12 Mbps</option><option value="16">16 Mbps</option><option value="25">25 Mbps</option></select></div>
    <div class="row"><label for="sOffset">音畫偏移（毫秒）<small>聲音比畫面早就填正數，晚就填負數</small></label>
      <input type="number" id="sOffset" min="-1000" max="1000" step="5" inputmode="numeric"></div>
    <div class="row"><label for="sRawAudio">原音收音<small>關閉降噪、回音消除、自動增益（錄遊戲音樂建議開）</small></label>
      <input type="checkbox" id="sRawAudio"></div>
    <div class="estimate" id="estimate"></div>
    <p class="sub" id="caps" style="margin:10px 0 0"></p>
    <button class="primary" id="applyBtn">套用並重新開始</button>
    <p class="sub" style="margin-top:10px">套用設定會清空目前的回放緩衝。</p>
  </div>
</div>

<!-- clips -->
<div class="sheet-wrap" id="clipsSheet">
  <div class="sheet">
    <h2>已保存的影片 <button class="secondary close" data-close>關閉</button></h2>
    <p class="sub" style="margin-top:-4px">影片只暫存在 App 裡，關掉 App 就會消失，記得按「存到相簿／分享」或「下載」。</p>
    <div id="clipList"></div>
  </div>
</div>

<div id="toast"></div>

<script src="mp4-muxer.js"></script>
<script src="app.js"></script>
</body>
</html>
